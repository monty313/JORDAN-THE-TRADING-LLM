<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1330" viewBox="0 0 960 1330" font-family="Segoe UI, Inter, Arial, sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a9a9a9"/></marker></defs>
<rect width="960" height="1330" fill="#1b1b1b"/>
<text x="14" y="30" fill="#ececec" font-size="17" font-weight="700">Jarvis against Mark  ·  how he thinks when he is behind</text>
<text x="14" y="50" fill="#a9a9a9" font-size="10.5">The gap is measured every wake. It never picks a lot, a name, or an entry. Source: STANDING_ORDERS 21:35, 21:38, 21:54; HOW_JARVIS_IS_DOING; confidence_meter.json.</text>
<rect x="14.0" y="68" width="302.6666666666667" height="92" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="26.0" y="88" fill="#7a7a7a" font-size="10" font-weight="700" letter-spacing="1.2">MARK</text>
<text x="26.0" y="120" fill="#ececec" font-size="26" font-weight="700">+38,535</text>
<text x="26.0" y="142" fill="#a9a9a9" font-size="9.5">Closed Client P/L. The bar to beat.</text>
<rect x="328.6666666666667" y="68" width="302.6666666666667" height="92" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="340.6666666666667" y="88" fill="#7a7a7a" font-size="10" font-weight="700" letter-spacing="1.2">JARVIS</text>
<text x="340.6666666666667" y="120" fill="#d8a444" font-size="26" font-weight="700">+298.86</text>
<text x="340.6666666666667" y="142" fill="#a9a9a9" font-size="9.5">Closed P/L, magic 771249, after 12:36 ET. 183 tickets. 0.78% of the bar.</text>
<rect x="643.3333333333334" y="68" width="302.6666666666667" height="92" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="655.3333333333334" y="88" fill="#7a7a7a" font-size="10" font-weight="700" letter-spacing="1.2">GAP</text>
<text x="655.3333333333334" y="120" fill="#5b9bff" font-size="26" font-weight="700">38,236</text>
<text x="655.3333333333334" y="142" fill="#a9a9a9" font-size="9.5">Does not pick the lot, the name, the entry, or a new deadline.</text>
<text x="14" y="176" fill="#7a7a7a" font-size="10">Floating profit does not count. The deadline was named once, 00:36 ET on 2026-09-23. No later chat moves it or declares the score beaten without a history read.</text>
<rect x="0" y="190" width="960" height="1040" fill="#212121"/>
<text x="14" y="208" fill="#7a7a7a" font-size="10.5" font-weight="700" letter-spacing="1.4">THE LOOP</text>
<path d="M130.0,1170 L60,1170 L60,235 L128.0,235" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
<text x="60" y="1223.0" fill="#7a7a7a" font-size="10">next wake: back to 1, measure again</text>
<line x1="340" y1="270.0" x2="340" y2="299.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="370.0" x2="340" y2="399.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="470.0" x2="340" y2="499.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="570.0" x2="340" y2="595.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="505.0" y1="645" x2="664.0" y2="645" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="584.5" y="639" text-anchor="middle" fill="#a9a9a9" font-size="10">no</text>
<line x1="340" y1="694.0" x2="340" y2="709.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="347" y="705.5" fill="#a9a9a9" font-size="10">yes</text>
<line x1="340" y1="780.0" x2="340" y2="811.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="505.0" y1="855" x2="664.0" y2="855" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="584.5" y="849" text-anchor="middle" fill="#a9a9a9" font-size="10">no</text>
<line x1="340" y1="898.0" x2="340" y2="919.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="347" y="912.5" fill="#a9a9a9" font-size="10">yes</text>
<line x1="340" y1="990.0" x2="340" y2="1015.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="505.0" y1="1065" x2="664.0" y2="1065" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="584.5" y="1059" text-anchor="middle" fill="#a9a9a9" font-size="10">no</text>
<line x1="340" y1="1114.0" x2="340" y2="1134.0" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="347" y="1128.0" fill="#a9a9a9" font-size="10">yes</text>
<rect x="130.0" y="200.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="220.0" fill="#ececec" font-size="13" font-weight="700">1  Measure the score honestly</text>
<text x="142.0" y="237.0" fill="#a9a9a9" font-size="10">History read of closed 771249 tickets opened after 12:36 ET. Floating excluded.</text>
<text x="142.0" y="250.0" fill="#a9a9a9" font-size="10">confidence_meter.json: n=183, sum=+298.86, beaten=false. Do not round up.</text>
<rect x="130.0" y="300.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="320.0" fill="#ececec" font-size="13" font-weight="700">2  Bucket what paid and what did not</text>
<text x="142.0" y="337.0" fill="#a9a9a9" font-size="10">By symbol, side, family, set, session. Always after spread.</text>
<text x="142.0" y="350.0" fill="#a9a9a9" font-size="10">Metal sells +4,448.91 (n=3). Rest of window about −4,150. 10-lot FX basket −5,207.</text>
<rect x="130.0" y="400.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="420.0" fill="#ececec" font-size="13" font-weight="700">3  Write one hypothesis as a relation</text>
<text x="142.0" y="437.0" fill="#a9a9a9" font-size="10">Not a recipe. Example: precious_metal_sell is a clue with a sample of three.</text>
<text x="142.0" y="450.0" fill="#a9a9a9" font-size="10">Example: no alignment count licenses an entry (229 tickets at 0.01, −13.25).</text>
<rect x="130.0" y="500.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="520.0" fill="#ececec" font-size="13" font-weight="700">4  Test it in shadow</text>
<text x="142.0" y="537.0" fill="#a9a9a9" font-size="10">Walk-forward on closed bars. Design grid after spread. reader_repl needs 20 closes</text>
<text x="142.0" y="550.0" fill="#a9a9a9" font-size="10">per exit reason before a split is promoted. ATLAS emergence stays in shadow. No ticket.</text>
<path d="M340,596.0 L505.0,645 L340,694.0 L175.0,645 z" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
<text x="340" y="642" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">Survived spread and</text>
<text x="340" y="656" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">out-of-sample?</text>
<rect x="665.0" y="609.0" width="250" height="72" rx="10" fill="#343434" stroke="#7a7a7a" stroke-width="1.2"/>
<text x="677.0" y="627.0" fill="#7a7a7a" font-size="12" font-weight="700">Refusal is data</text>
<text x="677.0" y="642.0" fill="#a9a9a9" font-size="9.5">Write it to LEARNING_LOG and RETAINED.</text>
<text x="677.0" y="654.0" fill="#a9a9a9" font-size="9.5">12 of 12 forward attempts failed. Recorded,</text>
<text x="677.0" y="666.0" fill="#a9a9a9" font-size="9.5">not retried on the same window. Back to step 2.</text>
<rect x="130.0" y="710.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="730.0" fill="#ececec" font-size="13" font-weight="700">5  Propose in JOURNAL.md</text>
<text x="142.0" y="747.0" fill="#a9a9a9" font-size="10">A proposed lesson. The 007 baseline stays read-only.</text>
<text x="142.0" y="760.0" fill="#a9a9a9" font-size="10">Nothing changes the act until Mark accepts it.</text>
<path d="M340,812.0 L505.0,855 L340,898.0 L175.0,855 z" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
<text x="340" y="859" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">Mark accepted it?</text>
<rect x="665.0" y="825.0" width="250" height="60" rx="10" fill="#343434" stroke="#7a7a7a" stroke-width="1.2"/>
<text x="677.0" y="843.0" fill="#7a7a7a" font-size="12" font-weight="700">Stays proposed</text>
<text x="677.0" y="858.0" fill="#a9a9a9" font-size="9.5">May be named beside a thesis.</text>
<text x="677.0" y="870.0" fill="#a9a9a9" font-size="9.5">It does not vote.</text>
<rect x="130.0" y="920.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="940.0" fill="#ececec" font-size="13" font-weight="700">6  Amend STANDING_ORDERS</text>
<text x="142.0" y="957.0" fill="#a9a9a9" font-size="10">The rule now lives in the file the sender reads.</text>
<text x="142.0" y="970.0" fill="#a9a9a9" font-size="10">A rule that only lives in a paragraph is not a rule.</text>
<path d="M340,1016.0 L505.0,1065 L340,1114.0 L175.0,1065 z" fill="#262626" stroke="#5b9bff" stroke-width="1.6"/>
<text x="340" y="1062" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">Ladder loaded? risk_floor set, harness</text>
<text x="340" y="1076" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">present, rung above OBSERVATION_ONLY?</text>
<rect x="665.0" y="1035.0" width="250" height="60" rx="10" fill="#343434" stroke="#5b9bff" stroke-width="1.6"/>
<text x="677.0" y="1053.0" fill="#d8a444" font-size="12" font-weight="700">Improve the speech, not the ticket</text>
<text x="677.0" y="1068.0" fill="#a9a9a9" font-size="9.5">The lesson sharpens the spoken act and the gate.</text>
<text x="677.0" y="1080.0" fill="#a9a9a9" font-size="9.5">New orders stay SAFE_HOLD.</text>
<text x="790" y="1109.0" text-anchor="middle" fill="#5b9bff" font-size="10" font-weight="600">today the loop exits here</text>
<rect x="130.0" y="1135.0" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
<text x="142.0" y="1155.0" fill="#4fb383" font-size="13" font-weight="700">7  One bounded demo trade at a time</text>
<text x="142.0" y="1172.0" fill="#a9a9a9" font-size="10">Fresh S1 or S2 fire, thesis on disk, structural stop, the lot Mark named.</text>
<text x="142.0" y="1185.0" fill="#a9a9a9" font-size="10">Evaluate. Learn. Repeat. Size comes from risk, never from the gap.</text>
<rect x="640" y="215" width="300" height="240" rx="4" fill="#2a2a2a" stroke="#e0554d" stroke-width="1"/>
<text x="652" y="235" fill="#e0554d" font-size="12" font-weight="700">When the gap tempts him: refused</text>
<text x="652" y="257" fill="#a9a9a9" font-size="10">×  Bigger lots because the score is far</text>
<text x="652" y="272" fill="#a9a9a9" font-size="10">×  More names because the book looks thin</text>
<text x="652" y="287" fill="#a9a9a9" font-size="10">×  A later signal to rescue an old thesis</text>
<text x="652" y="302" fill="#a9a9a9" font-size="10">×  Holding a scalp because it is losing</text>
<text x="652" y="317" fill="#a9a9a9" font-size="10">×  Adding to a losing trade</text>
<text x="652" y="332" fill="#a9a9a9" font-size="10">×  Turning an emerged stamp into an order</text>
<text x="652" y="347" fill="#a9a9a9" font-size="10">×  Hiding a loss, or rewriting the reason after the fill</text>
<text x="652" y="362" fill="#a9a9a9" font-size="10">×  Calling a green float the score</text>
<text x="652" y="377" fill="#a9a9a9" font-size="10">×  Inventing a deadline, a cutoff, or the harness file</text>
<text x="652" y="421" fill="#7a7a7a" font-size="9.5">Each one has already cost money on this desk:</text>
<text x="652" y="435" fill="#7a7a7a" font-size="9.5">10-lot basket −5,207 · forced fives −13.25 · gold-euro buy −514</text>
<rect x="640" y="1130" width="300" height="82" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="652" y="1150" fill="#ececec" font-size="12" font-weight="700">Exit learning runs beside the loop</text>
<text x="652" y="1168" fill="#a9a9a9" font-size="9.5">Five-minute assistant may close a 771249 ticket for</text>
<text x="652" y="1180" fill="#a9a9a9" font-size="9.5">momentum_dying or will_not_rejoin. It never opens.</text>
<text x="652" y="1192" fill="#a9a9a9" font-size="9.5">reader_repl groups those exits. No split is promoted</text>
<text x="652" y="1204" fill="#a9a9a9" font-size="9.5">before 20 closes per reason. A close is not a new name.</text>
<rect x="14" y="1246" width="932" height="66" rx="4" fill="#2a2a2a" stroke="#5b9bff" stroke-width="1"/>
<text x="480.0" y="1272" text-anchor="middle" fill="#ececec" font-size="12.5" font-weight="600">Relentless in learning, testing, measuring, selecting, and improving.</text>
<text x="480.0" y="1294" text-anchor="middle" fill="#ececec" font-size="12.5" font-weight="600">Not reckless because the score is large or because I am behind.</text>
</svg>