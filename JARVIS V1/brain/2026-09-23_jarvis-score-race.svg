<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1520" viewBox="0 0 960 1520" font-family="Segoe UI, Inter, Arial, sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a9a9a9"/></marker></defs>
<rect width="960" height="1520" fill="#1b1b1b"/>
<text x="14" y="28" fill="#ececec" font-size="17" font-weight="700">Jarvis against Mark  ·  2026-09-23 15:48 ET</text>
<text x="14" y="48" fill="#a9a9a9" font-size="10.5">How he thinks when the closed score is behind yours, and how he is allowed to get bigger. Demo. Client tickets untouched.</text>
<rect x="14" y="62" width="303" height="92" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="26" y="82" fill="#7a7a7a" font-size="10" font-weight="700" letter-spacing="1.2">MARK</text>
<text x="26" y="114" fill="#ececec" font-size="26" font-weight="700">+38,535</text>
<text x="26" y="136" fill="#a9a9a9" font-size="9.5">Closed Client P/L. The bar to beat.</text>
<rect x="328" y="62" width="303" height="92" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="340" y="82" fill="#7a7a7a" font-size="10" font-weight="700" letter-spacing="1.2">JARVIS</text>
<text x="340" y="114" fill="#d8a444" font-size="26" font-weight="700">+298.86</text>
<text x="340" y="136" fill="#a9a9a9" font-size="9.5">Closed P/L, magic 771249, after 12:36 ET. 183 tickets.</text>
<rect x="643" y="62" width="303" height="92" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="655" y="82" fill="#7a7a7a" font-size="10" font-weight="700" letter-spacing="1.2">GAP</text>
<text x="655" y="114" fill="#5b9bff" font-size="26" font-weight="700">38,236</text>
<text x="655" y="136" fill="#a9a9a9" font-size="9.5">May grow size on a high-confidence official fire. Not a spray.</text>
<text x="14" y="172" fill="#7a7a7a" font-size="10">Floating does not count. Deadline named once: 00:36 ET 2026-09-23. Do not invent a new one. beaten=false until a history read.</text>
<rect x="14" y="184" width="932" height="58" rx="4" fill="#2a2a2a" stroke="#5b9bff"/>
<text x="26" y="204" fill="#5b9bff" font-size="12" font-weight="700">Always-on eyes  ·  he was always allowed to read these</text>
<text x="26" y="222" fill="#a9a9a9" font-size="10.5">Mark's screener  ·  RollTide.mq5 and rolltide.csv  ·  JarvisEyes.mq5 and board.csv. Official act still comes from S1–S4 on the JarvisEyes closed bar. RollTide and the screener are extra glass, not a second fire.</text>
<rect x="0" y="256" width="960" height="1040" fill="#212121"/>
<text x="14" y="274" fill="#7a7a7a" font-size="10.5" font-weight="700" letter-spacing="1.4">THE LOOP</text>
<rect x="130" y="288" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="308" fill="#ececec" font-size="13" font-weight="700">1  Measure the score honestly</text>
<text x="142" y="325" fill="#a9a9a9" font-size="10">History read of closed 771249 after 12:36 ET. Floating excluded.</text>
<text x="142" y="338" fill="#a9a9a9" font-size="10">confidence_meter.json: n=183, sum=+298.86, beaten=false. Do not round up.</text>
<rect x="130" y="388" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="408" fill="#ececec" font-size="13" font-weight="700">2  Bucket what paid and what did not</text>
<text x="142" y="425" fill="#a9a9a9" font-size="10">By symbol, side, family, set, session. Always after spread.</text>
<text x="142" y="438" fill="#a9a9a9" font-size="10">Metal sells +4,448.91 (n=3). Rest about −4,150. 10-lot FX basket −5,207.</text>
<rect x="130" y="488" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="508" fill="#ececec" font-size="13" font-weight="700">3  Write one hypothesis as a relation</text>
<text x="142" y="525" fill="#a9a9a9" font-size="10">Not a recipe. precious_metal_sell is a clue with a sample of three.</text>
<text x="142" y="538" fill="#a9a9a9" font-size="10">No alignment count licenses an entry (229 tickets at 0.01, −13.25).</text>
<rect x="130" y="588" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="608" fill="#ececec" font-size="13" font-weight="700">4  Test it in shadow</text>
<text x="142" y="625" fill="#a9a9a9" font-size="10">Walk-forward on closed bars. Design grid after spread.</text>
<text x="142" y="638" fill="#a9a9a9" font-size="10">reader_repl needs 20 closes per exit reason. ATLAS stays in shadow.</text>
<line x1="340" y1="358" x2="340" y2="387" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="458" x2="340" y2="487" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="558" x2="340" y2="587" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M340,650 L505,698 L340,746 L175,698 z" fill="#262626" stroke="#3d3d3d"/>
<text x="340" y="694" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">Survived spread and</text>
<text x="340" y="710" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">out-of-sample?</text>
<line x1="340" y1="658" x2="340" y2="649" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="505" y1="698" x2="664" y2="698" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="584" y="692" text-anchor="middle" fill="#a9a9a9" font-size="10">no</text>
<rect x="665" y="662" width="250" height="72" rx="10" fill="#343434" stroke="#7a7a7a"/>
<text x="677" y="680" fill="#7a7a7a" font-size="12" font-weight="700">Refusal is data</text>
<text x="677" y="695" fill="#a9a9a9" font-size="9.5">Write LEARNING_LOG and RETAINED.</text>
<text x="677" y="709" fill="#a9a9a9" font-size="9.5">12 of 12 forward attempts failed.</text>
<text x="677" y="723" fill="#a9a9a9" font-size="9.5">Recorded. Back to step 2.</text>
<line x1="340" y1="746" x2="340" y2="776" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="347" y="768" fill="#a9a9a9" font-size="10">yes</text>
<rect x="130" y="777" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="797" fill="#ececec" font-size="13" font-weight="700">5  Propose in JOURNAL.md</text>
<text x="142" y="814" fill="#a9a9a9" font-size="10">A proposed lesson. The 007 baseline stays read-only.</text>
<text x="142" y="827" fill="#a9a9a9" font-size="10">Nothing changes a sensor until Mark accepts it.</text>
<line x1="340" y1="847" x2="340" y2="849" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M340,849 L505,892 L340,935 L175,892 z" fill="#262626" stroke="#3d3d3d"/>
<text x="340" y="896" text-anchor="middle" fill="#ececec" font-size="11" font-weight="600">Mark accepted it?</text>
<line x1="505" y1="892" x2="664" y2="892" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="584" y="886" text-anchor="middle" fill="#a9a9a9" font-size="10">no</text>
<rect x="665" y="862" width="250" height="60" rx="10" fill="#343434" stroke="#7a7a7a"/>
<text x="677" y="880" fill="#7a7a7a" font-size="12" font-weight="700">Stays proposed</text>
<text x="677" y="895" fill="#a9a9a9" font-size="9.5">May be named beside a thesis.</text>
<text x="677" y="907" fill="#a9a9a9" font-size="9.5">It does not vote on S1–S4.</text>
<line x1="340" y1="935" x2="340" y2="965" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="347" y="958" fill="#a9a9a9" font-size="10">yes</text>
<rect x="130" y="966" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="986" fill="#ececec" font-size="13" font-weight="700">6  Amend STANDING_ORDERS</text>
<text x="142" y="1003" fill="#a9a9a9" font-size="10">The rule now lives in the file the sender reads.</text>
<text x="142" y="1016" fill="#a9a9a9" font-size="10">A rule that only lives in a paragraph is not a rule.</text>
<line x1="340" y1="1036" x2="340" y2="1055" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="130" y="1056" width="420" height="88" rx="4" fill="#2a2a2a" stroke="#4fb383" stroke-width="1.6"/>
<text x="142" y="1076" fill="#4fb383" font-size="13" font-weight="700">7  Size, add, and manage  ·  in force 15:48</text>
<text x="142" y="1093" fill="#a9a9a9" font-size="10">High-confidence official FIRE may take a bigger lot to beat +38,535.</text>
<text x="142" y="1106" fill="#a9a9a9" font-size="10">Add only to a winning 771249 ticket whose original story is still true.</text>
<text x="142" y="1119" fill="#a9a9a9" font-size="10">He may act on his own open book at any time. Goal: autonomous demo desk.</text>
<line x1="340" y1="1144" x2="340" y2="1163" stroke="#a9a9a9" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="130" y="1164" width="420" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="142" y="1184" fill="#ececec" font-size="13" font-weight="700">8  One bounded demo name, then evaluate</text>
<text x="142" y="1201" fill="#a9a9a9" font-size="10">Fresh S1 or S2 fire, thesis on disk, structural stop. Then learn.</text>
<text x="142" y="1214" fill="#a9a9a9" font-size="10">A close is not a reason to open the next name. 100 lots stay forbidden.</text>
<path d="M130,1199 L60,1199 L60,323 L128,323" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
<text x="60" y="1254" fill="#7a7a7a" font-size="10">next wake: back to 1</text>
<rect x="640" y="288" width="300" height="168" rx="4" fill="#1e2a24" stroke="#4fb383"/>
<text x="652" y="308" fill="#4fb383" font-size="12" font-weight="700">When he is behind: now allowed</text>
<text x="652" y="330" fill="#a9a9a9" font-size="10">+  Bigger lots on a high-confidence official fire</text>
<text x="652" y="346" fill="#a9a9a9" font-size="10">+  Add to a winning 771249 trade still on thesis</text>
<text x="652" y="362" fill="#a9a9a9" font-size="10">+  Manage his own open book at any time</text>
<text x="652" y="378" fill="#a9a9a9" font-size="10">+  Read the screener, RollTide, and JarvisEyes</text>
<text x="652" y="394" fill="#a9a9a9" font-size="10">+  Autonomy is the goal on the demo desk</text>
<text x="652" y="424" fill="#7a7a7a" font-size="9.5">Issue this pass: too many good metal and keep10</text>
<text x="652" y="438" fill="#7a7a7a" font-size="9.5">closes stayed 1.0 lot. Size should have grown.</text>
<rect x="640" y="468" width="300" height="188" rx="4" fill="#2a1e1e" stroke="#e0554d"/>
<text x="652" y="488" fill="#e0554d" font-size="12" font-weight="700">Still refused</text>
<text x="652" y="510" fill="#a9a9a9" font-size="10">×  More names because the book looks thin</text>
<text x="652" y="526" fill="#a9a9a9" font-size="10">×  A later signal to rescue an old thesis</text>
<text x="652" y="542" fill="#a9a9a9" font-size="10">×  Adding to a losing trade</text>
<text x="652" y="558" fill="#a9a9a9" font-size="10">×  Holding a scalp only because it is losing</text>
<text x="652" y="574" fill="#a9a9a9" font-size="10">×  Turning an emerged stamp into an order</text>
<text x="652" y="590" fill="#a9a9a9" font-size="10">×  Calling a green float the score</text>
<text x="652" y="606" fill="#a9a9a9" font-size="10">×  Touching a Client ticket</text>
<text x="652" y="622" fill="#a9a9a9" font-size="10">×  Inventing a deadline, cutoff, or harness</text>
<text x="652" y="638" fill="#a9a9a9" font-size="10">×  100 lots, or a live account Mark did not name</text>
<rect x="640" y="1056" width="300" height="88" rx="4" fill="#2a2a2a" stroke="#5b9bff"/>
<text x="652" y="1076" fill="#5b9bff" font-size="12" font-weight="700">Autonomous demo desk</text>
<text x="652" y="1094" fill="#a9a9a9" font-size="9.5">He does not wait for a named ticket to manage,</text>
<text x="652" y="1108" fill="#a9a9a9" font-size="9.5">add to a winner, or resize a still-valid fire.</text>
<text x="652" y="1122" fill="#a9a9a9" font-size="9.5">New names still need official FIRE + thesis.</text>
<text x="652" y="1136" fill="#a9a9a9" font-size="9.5">Re-read the book immediately before any mutate.</text>
<rect x="640" y="1164" width="300" height="70" rx="4" fill="#2a2a2a" stroke="#3d3d3d"/>
<text x="652" y="1184" fill="#ececec" font-size="12" font-weight="700">Exit learning still runs beside</text>
<text x="652" y="1202" fill="#a9a9a9" font-size="9.5">momentum_dying or will_not_rejoin on 771249.</text>
<text x="652" y="1216" fill="#a9a9a9" font-size="9.5">20 closes per reason before a split is promoted.</text>
<rect x="14" y="1428" width="932" height="74" rx="4" fill="#2a2a2a" stroke="#5b9bff"/>
<text x="480" y="1454" text-anchor="middle" fill="#ececec" font-size="12.5" font-weight="600">Relentless in learning, sizing high-confidence fires, adding to winners, and managing his own book.</text>
<text x="480" y="1476" text-anchor="middle" fill="#ececec" font-size="12.5" font-weight="600">Not reckless: no Client tickets, no loser adds, no invented cutoffs, no 100-lot, no unnamed live account.</text>
</svg>